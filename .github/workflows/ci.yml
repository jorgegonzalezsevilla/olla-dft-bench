name: CI
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m venv .venv && .venv/bin/pip install -q -r requirements.lock pytest pyflakes
      - run: .venv/bin/python -m pyflakes bench.py benchlib tools tests
      - run: .venv/bin/python -m pytest -q
